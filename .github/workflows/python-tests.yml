name: Python and Flask UI tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      PYTHON_DOTENV_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-ci.txt
          python -m pip check
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run Python regression tests
        run: |
          mkdir -p ui_diagnostics
          python -m unittest test_source_provenance test_index_options -v 2>&1 | tee ui_diagnostics/unit-tests.log
      - name: Verify Flask UI on desktop and mobile
        run: python verify_ui.py 2>&1 | tee ui_diagnostics/browser.log
      - name: Upload test logs and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: oncointerpreter-test-results
          path: ui_diagnostics/
          if-no-files-found: warn
          retention-days: 14
